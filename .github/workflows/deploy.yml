name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you re-deploy by hand from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN needs to read the repo, mint an OIDC token for the Pages
# deployment, and write the Pages site itself
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; queued runs wait rather than cancel, so a push
# never leaves the site half-published
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
